<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreadHive — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{background:#fff;border-radius:20px;padding:48px 44px;width:100%;max-width:420px;box-shadow:0 4px 40px rgba(0,0,0,.08)}
.brand{text-align:center;margin-bottom:32px}
.brand-logo{width:52px;height:52px;background:#111;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.brand-logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8}
.brand h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
.brand p{font-size:14px;color:#888;margin-top:4px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.role-card{border:2px solid #eee;border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .2s}
.role-card:hover{border-color:#888}
.role-card.selected{border-color:#111;background:#111;color:#fff}
.role-card svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;display:block;margin:0 auto 8px}
.role-card p{font-size:14px;font-weight:700}
.role-card span{font-size:12px;opacity:.6;margin-top:3px;display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:6px;letter-spacing:.3px}
.field input{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:10px;font-size:14px;font-family:'Inter';outline:none;transition:border .15s}
.field input:focus{border-color:#111}
.err{background:#fff0f0;border:1.5px solid #fecaca;border-radius:10px;padding:10px 14px;font-size:13px;color:#dc2626;font-weight:600;margin-bottom:12px;display:none}
.btn{width:100%;padding:13px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;transition:background .15s}
.btn:hover{background:#333}
.demo{margin-top:20px;background:#fafafa;border-radius:12px;padding:14px 16px;font-size:13px;color:#777;line-height:2.2}
.demo strong{color:#333}
code{background:#eee;padding:2px 7px;border-radius:5px;font-family:monospace;font-size:12px;color:#333}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.57a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.57a2 2 0 00-1.34-2.23z"/></svg></div>
    <h1>ThreadHive</h1>
    <p>Sign in to continue</p>
  </div>
  <p style="font-size:13px;font-weight:700;color:#333;margin-bottom:10px">I am a...</p>
  <div class="role-grid">
    <div class="role-card selected" id="rc-customer" onclick="setRole('customer')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <p>Customer</p><span>Shop &amp; browse</span>
    </div>
    <div class="role-card" id="rc-business" onclick="setRole('business')">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <p>Business</p><span>Admin panel</span>
    </div>
  </div>
  <div class="field"><label>EMAIL ADDRESS</label><input id="email" type="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')login()"/></div>
  <div class="field"><label>PASSWORD</label><input id="pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/></div>
  <div class="err" id="err">⚠ Invalid email or password.</div>
  <button class="btn" onclick="login()">Sign in →</button>
  <div class="demo">
    <strong>Demo accounts</strong><br>
    Customer: <code>user@demo.com</code> / <code>user123</code><br>
    Business:&nbsp; <code>admin@demo.com</code> / <code>admin123</code>
  </div>
</div>
<script>
let role='customer';
const accounts={'user@demo.com':{pass:'user123',role:'customer'},'admin@demo.com':{pass:'admin123',role:'business'}};
function setRole(r){
  role=r;
  document.getElementById('rc-customer').className='role-card'+(r==='customer'?' selected':'');
  document.getElementById('rc-business').className='role-card'+(r==='business'?' selected':'');
}
function login(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value;
  const err=document.getElementById('err');
  const acc=accounts[email];
  if(!acc||acc.pass!==pass){err.style.display='block';return;}
  if(acc.role!==role){err.innerHTML='⚠ Wrong role selected for this account.';err.style.display='block';return;}
  err.style.display='none';
  window.location.href=acc.role==='business'?'business.html':'home.html';
}
</script>
</body>
</html>
